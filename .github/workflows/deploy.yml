name: Deploy Discord Bot

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  # Only if you have tests
        
    - name: Verify Python path
      run: |
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -R
        echo "Python path:"
        python -c "import sys; print(sys.path)"
        
    - name: Run Bot
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        PYTHONPATH: ${{ github.workspace }}  # Critical fix
      run: |
        python -c "from src.bot import bot; print('Bot import successful')"
        nohup python src/bot.py > bot.log 2>&1 &
        sleep 15
        if ! pgrep -f "python src/bot.py"; then
          echo "::error::Bot failed to start"
          cat bot.log
          exit 1
        fi
